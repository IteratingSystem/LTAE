name: Create Release for JitPack

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，确保 git log 可用

      - name: Extract version
        id: get_version
        run: echo "VERSION=$(grep 'worldloomVersion' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Check Git Tag
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Tag already exists: ${{ steps.get_version.outputs.VERSION }}"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag "${{ steps.get_version.outputs.VERSION }}"
          git push origin "${{ steps.get_version.outputs.VERSION }}"

      - name: Get commit message
        if: steps.check_tag.outputs.exists == 'false'
        id: commit_msg
        run: |
          echo "msg<<EOF" >> $GITHUB_OUTPUT
          git log -1 --format=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.commit_msg.outputs.msg }}
